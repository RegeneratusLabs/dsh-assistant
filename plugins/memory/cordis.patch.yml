# Bundle patch for the assistant memory layer: one Host row that reads the
# curated profile file, injects it as a bounded prompt section, and registers the
# memory_remember / memory_recall / memory_forget tools over the Hindsight REST API.
#
# A profile's own patch layer may override the row by id:
#
#   - id: dsh-memory
#     config:
#       apiUrl: http://127.0.0.1:9177      # empty = semantic memory off (default)
#       bankId: dsh-assistant              # only used when apiUrl is set
#       profilePath: ~/.dsh-assistant/memory/profile.json
#       userBudget: 2200                   # chars, about-the-user track
#       agentBudget: 4000                  # chars, notes-to-self track
#       recallMaxTokens: 800
#       timeoutMs: 4000
#       inject: true                       # false = tools only, no prompt block
#       recallInject: true                 # false = no automatic per-turn recall
#       recallInjectCount: 3               # facts added to a turn, max 5
#       recallInjectTimeoutMs: 1200        # a turn waits at most this long for it
- insert:
    - id: dsh-memory
      name: '@local/dsh-memory'
