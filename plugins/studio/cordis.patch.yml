# The studio's bundle patch: two rows, in this order.
#
# 1. The skill row reuses DSH's own filesystem skill provider, rooted at this
#    package's `skill/` directory, so SKILL.md is discovered as the `studio`
#    skill. It stays first: the skill is what the model reads before it can
#    deliver anything. `baseUrl` is the profile's patch file; resolving our
#    package there keeps the path correct whether the package is linked or
#    installed.
# 2. The package's own row runs this package's `apply()` and its browser half:
#    the works library the model registers deliveries into, the routes the page
#    reads (list, thumbnails, in-page preview, PNG/PDF export), and the Studio
#    page itself.
#
#    Optional `config.chromeBinary` names the Chromium binary the export route
#    spawns. Leave it empty (the default) and the row auto-detects the newest
#    `chrome-headless-shell`/`chromium` under `~/.cache/ms-playwright`; setting
#    it is for a machine whose browser lives elsewhere.
- insert:
    - id: dsh-studio-skill
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: studio
        bundledSkillDir: !!js process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@local/dsh-studio/package.json')), 'skill')
    - id: studio
      name: '@local/dsh-studio'
